const ITER=100000;
const te=new TextEncoder(),td=new TextDecoder();
function hexToBytes(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64ToBytes(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function concatBytes(a,b){const c=new Uint8Array(a.length+b.length);c.set(a,0);c.set(b,a.length);return c}
async function pbkdf2(pwd,saltHex,it){const km=await crypto.subtle.importKey('raw',te.encode(pwd),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:hexToBytes(saltHex),iterations:it},km,256);return new Uint8Array(bits)}
async function gcmDec(key,iv,data){const k=await crypto.subtle.importKey('raw',key,{name:'AES-GCM'},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},k,data);return new Uint8Array(pt)}
async function doLogin(){
  const msg=document.getElementById('msg');
  msg.textContent='';
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const acc=ACCOUNTS[u];
  if(!acc){msg.textContent='账号或密码错误';return;}
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='解密中...';
  try{
    const kek=await pbkdf2(p,acc.s,ITER);
    const dek=await gcmDec(kek,b64ToBytes(acc.wk.iv),concatBytes(b64ToBytes(acc.wk.ct),b64ToBytes(acc.wk.tag)));
    const html=await gcmDec(dek,b64ToBytes(CIPHER.iv),concatBytes(b64ToBytes(CIPHER.ct),b64ToBytes(CIPHER.tag)));
    document.open();document.write(td.decode(html));document.close();
  }catch(e){
    msg.textContent='账号或密码错误';
    btn.disabled=false;btn.textContent='解 锁';
  }
}
document.getElementById('btn').addEventListener('click',doLogin);
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
document.getElementById('u').focus();
})();</script>
